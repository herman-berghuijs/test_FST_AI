[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lintul2"
version = "0.1.0"
description = "Een 1-op-1 Python-port van het LINTUL2 FST-model voor zomertarwe"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["lintul2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
